<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar auto | Automotora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/mobile.css">
</head>
<body data-modo="editar">

    <header class="cabecera">
        <nav class="navbar navbar-expand container py-2">
            <a class="navbar-brand" href="/front/index.html">Automotora</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/front/index.html">Autos</a></li>
                <li class="nav-item"><a class="nav-link" href="/front/dist/pages/agregar.html">Agregar auto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container py-4" style="max-width: 46rem">
        <h1 class="h2 mb-1">Editar auto</h1>
        <p class="text-muted">Estás editando <strong id="titulo-auto">…</strong>. Todos los campos son obligatorios.</p>

        <div id="mensajes"></div>

        <form id="form-auto" class="panel p-4" novalidate>
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="id_marca" class="form-label">Marca</label>
                    <select id="id_marca" name="id_marca" class="form-select" required>
                        <option value="">Cargando marcas…</option>
                    </select>
                    <div id="error-id_marca" class="invalid-feedback">Selecciona una marca.</div>
                </div>
                <div class="col-md-6">
                    <label for="modelo" class="form-label">Modelo</label>
                    <input id="modelo" name="modelo" type="text" class="form-control" maxlength="50" required>
                    <div id="error-modelo" class="invalid-feedback">El modelo es obligatorio.</div>
                </div>
                <div class="col-md-4">
                    <label for="anio" class="form-label">Año</label>
                    <input id="anio" name="anio" type="number" class="form-control" min="1900" step="1" required>
                    <div id="error-anio" class="invalid-feedback">Ingresa un año válido.</div>
                </div>
                <div class="col-md-4">
                    <label for="precio" class="form-label">Precio (US$)</label>
                    <input id="precio" name="precio" type="number" class="form-control" min="0" step="0.01" required>
                    <div id="error-precio" class="invalid-feedback">Ingresa un precio válido (0 o mayor).</div>
                </div>
                <div class="col-md-4">
                    <label for="estado" class="form-label">Estado</label>
                    <select id="estado" name="estado" class="form-select" required>
                        <option value="">Selecciona…</option>
                        <option value="Nuevo">Nuevo</option>
                        <option value="Usado">Usado</option>
                    </select>
                    <div id="error-estado" class="invalid-feedback">Selecciona Nuevo o Usado.</div>
                </div>
            </div>

            <div class="d-flex flex-wrap gap-2 mt-4">
                <button id="btn-guardar" type="submit" class="btn btn-primary">Guardar cambios</button>
                <a id="btn-cancelar" class="btn btn-outline-secondary" href="/front/index.html">Cancelar</a>
            </div>
        </form>
    </main>

    <footer class="container py-3 text-muted">
        <small>Estado de la API: <a href="/api/estado" target="_blank">/api/estado</a></small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/form.js"></script>
</body>
</html>
