<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autos | Automotora</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="./dist/css/style.css">
    <link rel="stylesheet" href="./dist/css/mobile.css">
</head>
<body>

    <header class="cabecera">
        <nav class="navbar navbar-expand container py-2">
            <a class="navbar-brand" href="/front/index.html">Automotora</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link activo" aria-current="page" href="/front/index.html">Autos</a></li>
                <li class="nav-item"><a class="nav-link" href="/front/dist/pages/agregar.html">Agregar auto</a></li>
            </ul>
        </nav>
    </header>

    <main class="container py-4">

        <div class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-3">
            <div>
                <h1 class="h2 mb-1">Listado de autos</h1>
                <p id="contador" class="text-muted mb-0" aria-live="polite">Cargando…</p>
            </div>
            <div class="d-flex flex-wrap gap-2">
                <input id="buscador" type="search" class="form-control" style="width: 15rem" placeholder="Buscar marca o modelo" aria-label="Buscar marca o modelo">
                <a class="btn btn-primary" href="/front/dist/pages/agregar.html">Agregar auto</a>
            </div>
        </div>

        <div id="mensajes"></div>

        <div class="panel overflow-hidden">
            <table class="table tabla-autos">
                <thead>
                    <tr>
                        <th scope="col">Marca</th>
                        <th scope="col">Modelo</th>
                        <th scope="col" class="num">Año</th>
                        <th scope="col" class="num">Precio</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Disponibilidad</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo">
                    <tr><td colspan="6" class="text-center text-muted py-5">Cargando autos…</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <footer class="container py-3 text-muted">
        <small>Estado de la API: <a href="/api/estado" target="_blank">/api/estado</a></small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./dist/js/api.js"></script>
    <script src="./dist/js/utils.js"></script>
    <script src="./dist/js/script.js"></script>
</body>
</html>
